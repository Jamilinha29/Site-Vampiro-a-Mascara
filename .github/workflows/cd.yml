name: CD

on:
  push:
    branches: [main]

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Frontend artifact (Vercel publica o main automaticamente)
        run: test -f frontend/dist/index.html
      - name: API image de produção
        run: docker build -f docker/Dockerfile.backend.prod -t beladona-api:ci .
