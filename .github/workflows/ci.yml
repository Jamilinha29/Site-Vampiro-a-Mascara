name: CI & Deploy Pipeline

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: beladona-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Segredos e dados locais fora do Git
        run: npm run verify:git
      - name: npm audit (produção, sem --force)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w frontend
      - run: npm run build -w frontend
      - name: Verificar ausência de segredos no bundle frontend
        run: npm run verify:bundle
      - run: npx vitest run --config test/vitest.config.ts --project frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm run build -w backend
      - run: npx vitest run --config test/vitest.config.ts --project backend

  docker-test:
    runs-on: ubuntu-latest
    needs: [verify, frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml build
      - run: docker compose -f compose.test.yaml run --rm tests

  supabase-migrate:
    runs-on: ubuntu-latest
    needs: [verify, frontend, backend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push alterou supabase/migrations?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          else
            CHANGED=$(git diff-tree -m --first-parent --no-commit-id --name-only -r "${{ github.sha }}")
          fi
          if printf '%s\n' "$CHANGED" | grep -q '^supabase/migrations/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Nenhuma migração neste push — passo ignorado."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.run == 'true'
        with:
          version: latest

      - name: Aplicar migrações no projeto remoto
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "Secrets SUPABASE_* não configurados no GitHub Actions."
            exit 1
          fi
          supabase login --token "$SUPABASE_ACCESS_TOKEN"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes
          supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
