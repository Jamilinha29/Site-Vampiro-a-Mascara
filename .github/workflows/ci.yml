name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Segredos e dados locais fora do Git
        run: npm run verify:git
      - run: npm run lint
      - run: npm run build -w backend && npm run build
      - name: Verificar ausência de segredos no bundle frontend
        run: npm run verify:bundle
      - run: npm run test:ci
      - name: npm audit (produção, sem --force)
        run: npm audit --omit=dev --audit-level=high

  docker-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml build
      - run: docker compose -f compose.test.yaml run --rm tests
