name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:ci
      - name: npm audit (produção, sem --force)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  docker-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f compose.test.yaml build
      - run: docker compose -f compose.test.yaml run --rm tests
