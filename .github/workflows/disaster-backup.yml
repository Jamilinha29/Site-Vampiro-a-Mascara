name: Disaster Backup

permissions:
  contents: read

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  encrypted-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check required backup secrets
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BELADONA_BACKUP_KEY: ${{ secrets.BELADONA_BACKUP_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$BELADONA_BACKUP_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de backup externo ainda não configurados — passo ignorado."
          fi

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Export encrypted backup
        if: steps.gate.outputs.ready == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BELADONA_BACKUP_KEY: ${{ secrets.BELADONA_BACKUP_KEY }}
          BELADONA_BACKUP_DIR: ${{ runner.temp }}/beladona-backups
        run: npm run backup:export

      - name: Upload non-sensitive backup manifest only (never expose DB dump in public repo artifacts)
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: beladona-backup-manifest
          path: ${{ runner.temp }}/beladona-backups/latest-manifest.json
          retention-days: 30
