name: Ops & Keepalive

# Unifica monitoramento de saúde (Vercel) e keepalive do Supabase Free sem excesso de execuções.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: beladona-ops
  cancel-in-progress: false

jobs:
  health-and-keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: API health
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "HEALTH_URL não configurado — passo ignorado."; exit 0; fi
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 25 "$HEALTH_URL")
          test "$code" = "200" || (cat /tmp/health.json; exit 1)
          grep -q '"ok":true' /tmp/health.json

      - name: API ready
        env:
          READY_URL: ${{ secrets.READY_URL }}
        run: |
          if [ -z "$READY_URL" ]; then echo "READY_URL não configurado — passo ignorado."; exit 0; fi
          code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 25 "$READY_URL")
          test "$code" = "200" || (cat /tmp/ready.json; exit 1)
          grep -q '"ok":true' /tmp/ready.json

      - name: Site (SPA)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL não configurado — passo ignorado."; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "$SITE_URL")
          test "$code" = "200"

      - name: Supabase Free keepalive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL/SUPABASE_ANON_KEY não configurados — passo ignorado."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          test "$code" = "200" -o "$code" = "401" -o "$code" = "404"
