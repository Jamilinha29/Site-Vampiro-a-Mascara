services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend.prod
    ports:
      - '4000:4000'
    env_file:
      - .env
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend.prod
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy
